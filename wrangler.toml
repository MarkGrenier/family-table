# Family grocery list.
# database_id is the live list. Leave it as it is.

name = "family-grocery"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[dev]
ip = "0.0.0.0"
port = 47219
inspector_port = 9234
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "grocery"
database_id = "f1322e04-7c0a-4be7-a1cd-63b628757792"
migrations_dir = "migrations"
